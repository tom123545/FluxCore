server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: approval-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fluxcore_approval?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:fluxcore}
    password: ${DB_PASSWORD:fluxcore}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:fluxcore}
    password: ${RABBITMQ_PASSWORD:fluxcore}
management:
  endpoints:
    web:
      exposure:
        include: health,info
