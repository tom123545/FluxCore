server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: approval-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fluxcore?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:fluxcore}
    password: ${DB_PASSWORD:fluxcore}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
business:
  service:
    url: ${BUSINESS_SERVICE_URL:http://localhost:8082}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:fluxcore}
    password: ${RABBITMQ_PASSWORD:fluxcore}
management:
  endpoints:
    web:
      exposure:
        include: health,info
