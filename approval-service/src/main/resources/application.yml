server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: approval-service
  profiles:
    default: local
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
management:
  endpoints:
    web:
      exposure:
        include: health,info
fluxcore:
  internal:
    token: ${FLUXCORE_INTERNAL_TOKEN:fluxcore-internal-dev-token}
  messaging:
    approval:
      exchange: ${APPROVAL_EVENT_EXCHANGE:fluxcore.approval.events}
      routing-key: ${APPROVAL_EVENT_ROUTING_KEY:approval.event}
      publish-interval-ms: ${APPROVAL_OUTBOX_PUBLISH_INTERVAL_MS:1000}
      batch-size: ${APPROVAL_OUTBOX_BATCH_SIZE:50}
      retry-delay-seconds: ${APPROVAL_OUTBOX_RETRY_DELAY_SECONDS:30}
