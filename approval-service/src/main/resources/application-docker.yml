spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/fluxcore?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:fluxcore}
    password: ${DB_PASSWORD:fluxcore}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:fluxcore}
    password: ${RABBITMQ_PASSWORD:fluxcore}
fluxcore:
  messaging:
    approval:
      exchange: ${APPROVAL_EVENT_EXCHANGE:fluxcore.approval.events}
      routing-key: ${APPROVAL_EVENT_ROUTING_KEY:approval.event}
      publish-interval-ms: ${APPROVAL_OUTBOX_PUBLISH_INTERVAL_MS:1000}
      batch-size: ${APPROVAL_OUTBOX_BATCH_SIZE:50}
      retry-delay-seconds: ${APPROVAL_OUTBOX_RETRY_DELAY_SECONDS:30}
business:
  service:
    url: ${BUSINESS_SERVICE_URL:http://business-service:8082}
