server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: contract-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fluxcore_contract?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:fluxcore}
    password: ${DB_PASSWORD:fluxcore}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health,info
