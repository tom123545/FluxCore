spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/fluxcore?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:fluxcore}
    password: ${DB_PASSWORD:fluxcore}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:fluxcore}
    password: ${RABBITMQ_PASSWORD:fluxcore}
fluxcore:
  messaging:
    approval:
      exchange: ${APPROVAL_EVENT_EXCHANGE:fluxcore.approval.events}
      queue: ${APPROVAL_EVENT_QUEUE:fluxcore.approval.notifications}
      routing-key: ${APPROVAL_EVENT_ROUTING_KEY:approval.event}
