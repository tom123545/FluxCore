server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: business-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fluxcore?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:fluxcore}
    password: ${DB_PASSWORD:fluxcore}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
management:
  endpoints:
    web:
      exposure:
        include: health,info
